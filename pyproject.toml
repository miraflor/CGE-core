[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cge-core"
version = "0.3.0"
description = "A Pyomo-based CGE framework faithful to Hosoe, Gasawa & Hashimoto (2010)"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "James Matthew Miraflor", email = "james.miraflor@gmail.com" },
]
keywords = [
    "cge",
    "computable-general-equilibrium",
    "pyomo",
    "economics",
    "policy-simulation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pyomo>=6.0,<6.10; python_version < '3.10'",
    "pyomo>=6.0; python_version >= '3.10'",
    "dill>=0.3",
    "pandas>=1.3",
]

[project.optional-dependencies]
# A local NLP solver is required at runtime. Either install cyipopt (needs
# the IPOPT system library plus a PyNumero ASL build), or put an 'ipopt'
# executable on PATH -- e.g. `conda install -c conda-forge ipopt`.
solver = ["cyipopt>=1.4"]
test = ["pytest>=7.0"]
docs = ["jupyter-book>=0.15,<2"]
dev = ["pytest>=7.0", "build>=1.0", "jupyter-book>=0.15,<2"]

[project.urls]
Homepage = "https://github.com/miraflor/CGE-core"
Repository = "https://github.com/miraflor/CGE-core"
Changelog = "https://github.com/miraflor/CGE-core/blob/main/CHANGELOG.md"
Issues = "https://github.com/miraflor/CGE-core/issues"

[tool.setuptools.packages.find]
# Only ship the library. Without an explicit include, find_packages picks
# up `tests` as a top-level package and installs it into site-packages,
# where it collides with every other project that does the same.
include = ["cge_core*"]

[tool.setuptools.package-data]
cge_core = ["data/*/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "external_ifpri: requires the separately supplied official IFPRI source directory",
    "public_ifpri: uses only the independently authored redistributable synthetic fixture",
    "public_ifpri_solver: public IFPRI test that must execute with a real NLP solver",
]
