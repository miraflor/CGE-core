name: notebook execution

on:
  push:
    branches: [main]
    paths:
      - "cge_core/**"
      - "cam/**"
      - "notebooks/**"
      - "pyproject.toml"
      - ".github/workflows/notebooks.yml"
      - ".github/workflows/release.yml"
  pull_request:
    branches: [main]
    paths:
      - "cge_core/**"
      - "cam/**"
      - "notebooks/**"
      - "pyproject.toml"
      - ".github/workflows/notebooks.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

jobs:
  notebooks:
    name: all notebooks from wheel (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build and install CGE-Core wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m pip install dist/*.whl
          python -m pip install nbclient nbformat ipykernel

      - name: Execute every canonical notebook from installed wheel
        run: |
          python - <<'PY'
          from pathlib import Path
          import copy
          import tempfile

          import nbformat
          from nbclient import NotebookClient

          names = [
              "01_first_cge.ipynb",
              "02_policy_experiments.ipynb",
              "03_your_own_sam.ipynb",
              "04_camcge.ipynb",
              "05_ifpri.ipynb",
              "06_build_a_model.ipynb",
              "90_internals.ipynb",
          ]

          with tempfile.TemporaryDirectory(prefix="cge-notebooks-") as workdir:
              for name in names:
                  path = Path("notebooks") / name
                  nb = nbformat.read(path, as_version=4)
                  run = copy.deepcopy(nb)

                  # CI has already installed the wheel built from this commit.
                  # Remove only the network distribution step; all remaining
                  # notebook cells run exactly as published.
                  for cell in run.cells:
                      if cell.cell_type == "code" and "%pip install" in cell.source:
                          cell.source = "print('CGE-Core installed from the built wheel')"
                          break

                  print(f"EXECUTING {name}")
                  client = NotebookClient(
                      run,
                      timeout=600,
                      kernel_name="python3",
                      allow_errors=False,
                  )
                  client.execute(cwd=workdir)
                  print(f"PASS {name}")

          print("ALL SEVEN CANONICAL NOTEBOOKS PASSED FROM THE BUILT WHEEL")
          PY
