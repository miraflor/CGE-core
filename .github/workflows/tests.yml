name: tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast lane: structural tests only, no solver. Catches import errors,
  # packaging mistakes, and degree-of-freedom regressions in ~1 minute
  # across the full supported Python range.
  structural:
    name: structural (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run public tests (external IFPRI replication excluded)
        run: pytest tests/ -v -m "not external_ifpri" --strict-markers

  # Full lane: real IPOPT from conda-forge. The redistributable synthetic
  # IFPRI tests must execute here; official-source replication remains local.
  solver:
    name: solver (ipopt, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v6

      - uses: conda-incubator/setup-miniconda@v4
        with:
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: "true"
          auto-activate: "false"
          activate-environment: cge

      - name: Install IPOPT
        run: conda install -y -c conda-forge ipopt

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Confirm the solver is actually present
        run: |
          ipopt -v
          python -c "
          from pyomo.environ import SolverFactory
          assert SolverFactory('ipopt').available(exception_flag=False), 'ipopt not visible to Pyomo'
          print('ipopt available to Pyomo')
          "

      - name: Run public IFPRI solver tests
        run: |
          pytest tests/ifpri/test_public_synthetic.py -v \
            -m public_ifpri_solver --strict-markers \
            --junitxml=public-ifpri-solver.xml

      - name: Assert public IFPRI solver coverage
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("public-ifpri-solver.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          tests = sum(int(suite.attrib.get("tests", 0)) for suite in suites)
          skipped = sum(int(suite.attrib.get("skipped", 0)) for suite in suites)
          failures = sum(int(suite.attrib.get("failures", 0)) for suite in suites)
          errors = sum(int(suite.attrib.get("errors", 0)) for suite in suites)
          if tests < 2:
              raise SystemExit(
                  f"Expected at least 2 public IFPRI solver tests, collected {tests}."
              )
          if skipped or failures or errors:
              raise SystemExit(
                  "Public IFPRI solver coverage failed: "
                  f"tests={tests}, skipped={skipped}, failures={failures}, errors={errors}."
              )
          print(f"public IFPRI solver coverage OK: {tests} tests, zero skips")
          PY

      - name: Run full public suite
        run: |
          pytest tests/ -v -m "not external_ifpri" --strict-markers \
            --junitxml=full-public-suite.xml

      - name: Assert full public solver coverage
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("full-public-suite.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          tests = sum(int(suite.attrib.get("tests", 0)) for suite in suites)
          skipped = sum(int(suite.attrib.get("skipped", 0)) for suite in suites)
          failures = sum(int(suite.attrib.get("failures", 0)) for suite in suites)
          errors = sum(int(suite.attrib.get("errors", 0)) for suite in suites)
          if tests < 130:
              raise SystemExit(
                  f"Expected at least 130 public tests, collected {tests}."
              )
          if skipped or failures or errors:
              raise SystemExit(
                  "Full public solver coverage failed: "
                  f"tests={tests}, skipped={skipped}, failures={failures}, errors={errors}."
              )
          print(f"full public solver coverage OK: {tests} tests, zero skips")
          PY

  # Narrow correctness lint: syntax errors, undefined names, unused
  # imports, and unused local variables. Formatting is intentionally out of
  # scope so this remains a low-noise correctness gate.
  lint:
    name: lint (ruff E9/F)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run narrow Ruff correctness checks
        run: |
          python -m pip install --upgrade pip "ruff>=0.8,<1"
          ruff check cge_core tests --select E9,F

  # Packaging lane: the wheel contains only runtime packages/data, while the
  # source distribution also preserves tests, validation evidence, and docs.
  packaging:
    name: packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine cffconvert
          python -m build

      - name: Check metadata
        run: |
          twine check dist/*
          cffconvert --validate

      - name: Assert wheel contents
        run: |
          python - <<'PY'
          import glob
          import sys
          import zipfile

          names = set(zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist())
          errors = []

          leaked = sorted(name for name in names if name.startswith("tests/"))
          if leaked:
              errors.append(f"tests package leaked into the wheel: {leaked}")

          required = {
              "cge_core/models/simple/model.py",
              "cge_core/models/standard/model.py",
              "cge_core/models/camcge/model.py",
              "cge_core/models/camcge/data/set-i-.csv",
              "cge_core/models/ifpri/model.py",
          }
          missing = sorted(required - names)
          if missing:
              errors.append("runtime files missing from wheel: " + ", ".join(missing))

          obsolete = sorted({
              "cge_core/_alias.py",
              "cge_core/engine.py",
              "cge_core/api.py",
              "cge_core/modern_engine.py",
              "cge_core/solvers.py",
              "cge_core/samtools.py",
              "cge_core/practitioner.py",
              "cam/__init__.py",
              "cam/cam_model_def.py",
          } & names)
          if obsolete:
              errors.append("obsolete v0.7 runtime paths returned: " + ", ".join(obsolete))

          csvs = sorted(name for name in names if name.endswith(".csv"))
          if len(csvs) < 16:
              errors.append(f"expected at least 16 bundled CSVs, found {len(csvs)}")

          forbidden_roots = {
              "docs/",
              "notebooks/",
              "tests/",
              "validation/",
              "examples/",
              ".github/",
              "release/",
          }
          leaked_roots = sorted(
              name
              for name in names
              if any(name.startswith(root) for root in forbidden_roots)
          )
          if leaked_roots:
              errors.append(
                  "repository-only content leaked into wheel: "
                  + ", ".join(leaked_roots[:20])
              )

          if errors:
              print("\n".join("ERROR: " + error for error in errors))
              sys.exit(1)

          print(f"wheel OK: {len(csvs)} data files; runtime boundary intact")
          PY

      - name: Assert source distribution contents
        run: |
          python - <<'PY'
          import glob
          import sys
          import tarfile

          archive = glob.glob("dist/*.tar.gz")[0]
          with tarfile.open(archive, "r:gz") as handle:
              archive_names = handle.getnames()

          # sdists have one versioned top-level directory. Strip it so every
          # assertion below is an exact repository-relative path comparison.
          names = {
              name.split("/", 1)[1]
              for name in archive_names
              if "/" in name and name.split("/", 1)[1]
          }

          required = {
              # Canonical CAMCGE runtime.
              "cge_core/models/camcge/model.py",
              "cge_core/models/camcge/data/set-i-.csv",
              # Replication/validation evidence.
              "validation/cam/make_data.py",
              "validation/cam/replicate_base.py",
              "validation/cam/replicate_experiments.py",
              "tests/cam/test_replication.py",
              "tests/cam/test_validation_layout.py",
              "CAMCGE_REPLICATION_GUIDE.md",
              "CAMCGE_VALIDATION_REPORT.md",
          }

          missing = sorted(required - names)
          if missing:
              print("ERROR: source distribution missing: " + ", ".join(missing))
              sys.exit(1)

          stale = sorted({
              "cam/__init__.py",
              "cam/cam_model_def.py",
              "cam/data/set-i-.csv",
              "cam/replicate_base.py",
              "cam/replicate_experiments.py",
              "cge_core/engine.py",
              "cge_core/api.py",
              "cge_core/solvers.py",
              "cge_core/samtools.py",
          } & names)
          if stale:
              print(
                  "ERROR: obsolete CAMCGE source paths returned to the sdist: "
                  + ", ".join(stale)
              )
              sys.exit(1)

          print("sdist OK: canonical runtime, validation, tests, and docs included")
          PY

      - name: Install from wheel and smoke-test
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python - <<'PY'
          import cge_core
          from cge_core import CamCGE, StandardCGE

          standard = StandardCGE.example()
          cam = CamCGE.example()

          assert standard.data.is_dir(), "packaged StandardCGE data missing"
          assert cam.data.is_dir(), "packaged CAMCGE data missing"
          assert cge_core.__version__ == "0.8.0"

          # Canonical advanced model-definition path.
          from cge_core.models.standard.model import StdModelDef
          assert StdModelDef is not None

          print("wheel import/data smoke test OK, version", cge_core.__version__)
          PY
