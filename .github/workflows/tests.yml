name: tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast lane: structural tests only, no solver. Catches import errors,
  # packaging mistakes, and degree-of-freedom regressions in ~1 minute
  # across the full supported Python range.
  structural:
    name: structural (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run public tests (external IFPRI replication excluded)
        run: pytest tests/ -v -m "not external_ifpri" --strict-markers

  # Full lane: real IPOPT from conda-forge. The redistributable synthetic
  # IFPRI tests must execute here; official-source replication remains local.
  solver:
    name: solver (ipopt, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v6

      - uses: conda-incubator/setup-miniconda@v4
        with:
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: "true"
          auto-activate: "false"
          activate-environment: cge

      - name: Install IPOPT
        run: conda install -y -c conda-forge ipopt

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Confirm the solver is actually present
        run: |
          ipopt -v
          python -c "
          from pyomo.environ import SolverFactory
          assert SolverFactory('ipopt').available(exception_flag=False), 'ipopt not visible to Pyomo'
          print('ipopt available to Pyomo')
          "

      - name: Run public IFPRI solver tests
        run: |
          pytest tests/ifpri/test_public_synthetic.py -v \
            -m public_ifpri_solver --strict-markers \
            --junitxml=public-ifpri-solver.xml

      - name: Assert public IFPRI solver coverage
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("public-ifpri-solver.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          tests = sum(int(suite.attrib.get("tests", 0)) for suite in suites)
          skipped = sum(int(suite.attrib.get("skipped", 0)) for suite in suites)
          failures = sum(int(suite.attrib.get("failures", 0)) for suite in suites)
          errors = sum(int(suite.attrib.get("errors", 0)) for suite in suites)
          if tests < 2:
              raise SystemExit(
                  f"Expected at least 2 public IFPRI solver tests, collected {tests}."
              )
          if skipped or failures or errors:
              raise SystemExit(
                  "Public IFPRI solver coverage failed: "
                  f"tests={tests}, skipped={skipped}, failures={failures}, errors={errors}."
              )
          print(f"public IFPRI solver coverage OK: {tests} tests, zero skips")
          PY

      - name: Run full public suite
        run: |
          pytest tests/ -v -m "not external_ifpri" --strict-markers \
            --junitxml=full-public-suite.xml

      - name: Assert full public solver coverage
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("full-public-suite.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          tests = sum(int(suite.attrib.get("tests", 0)) for suite in suites)
          skipped = sum(int(suite.attrib.get("skipped", 0)) for suite in suites)
          failures = sum(int(suite.attrib.get("failures", 0)) for suite in suites)
          errors = sum(int(suite.attrib.get("errors", 0)) for suite in suites)
          if tests < 130:
              raise SystemExit(
                  f"Expected at least 130 public tests, collected {tests}."
              )
          if skipped or failures or errors:
              raise SystemExit(
                  "Full public solver coverage failed: "
                  f"tests={tests}, skipped={skipped}, failures={failures}, errors={errors}."
              )
          print(f"full public solver coverage OK: {tests} tests, zero skips")
          PY

  # Narrow correctness lint: syntax errors, undefined names, unused
  # imports, and unused local variables. Formatting is intentionally out of
  # scope so this remains a low-noise correctness gate.
  lint:
    name: lint (ruff E9/F)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run narrow Ruff correctness checks
        run: |
          python -m pip install --upgrade pip "ruff>=0.8,<1"
          ruff check cge_core cam tests --select E9,F

  # Packaging lane: the wheel must not leak the tests package, and the
  # bundled SAM data must actually ship.
  packaging:
    name: packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine cffconvert
          python -m build

      - name: Check metadata
        run: |
          twine check dist/*
          cffconvert --validate

      - name: Assert wheel contents
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist()
          errors = []
          leaked = [n for n in names if n.startswith('tests/')]
          if leaked:
              errors.append("tests package leaked into the wheel: %s" % leaked)
          csvs = [n for n in names if n.endswith('.csv')]
          if len(csvs) < 8:
              errors.append("expected 8 bundled CSVs, found %d" % len(csvs))
          if errors:
              print("\n".join("ERROR: " + e for e in errors))
              sys.exit(1)
          print("wheel OK: %d data files, no tests leaked" % len(csvs))
          PY

      - name: Assert source distribution contents
        run: |
          python - <<'PY'
          import glob
          import sys
          import tarfile

          archive = glob.glob("dist/*.tar.gz")[0]
          with tarfile.open(archive, "r:gz") as handle:
              names = handle.getnames()
          required = [
              "cam/__init__.py",
              "cam/cam_model_def.py",
              "cam/replicate_base.py",
              "cam/replicate_experiments.py",
              "cam/data/set-i-.csv",
              "tests/cam/test_replication.py",
              "CAMCGE_REPLICATION_GUIDE.md",
              "CAMCGE_VALIDATION_REPORT.md",
          ]
          missing = [
              item for item in required
              if not any(name.endswith(item) for name in names)
          ]
          if missing:
              print("ERROR: source distribution missing: " + ", ".join(missing))
              sys.exit(1)
          print("sdist OK: CAMCGE benchmark, tests, data, and docs included")
          PY

      - name: Install from wheel and smoke-test
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python - <<'PY'
          import cge_core
          from cge_core import PyCGE, example_data
          from cge_core.examples.stdcge_model_def import StdModelDef
          d = example_data('stdcge')
          assert d.is_dir(), "packaged SAM data missing from the wheel"
          print("import OK, version", cge_core.__version__)
          PY
