# Jupyter Book configuration for the CGE-Core documentation.
title: CGE-Core
author: "James Matthew Miraflor — Project Lead and Maintainer"
copyright: "2026"

execute:
  execute_notebooks: "off"

repository:
  url: https://github.com/miraflor/CGE-core
  path_to_book: docs
  branch: main

html:
  use_issues_button: true
  use_repository_button: true

parse:
  myst_enable_extensions:
    - amsmath
    - dollarmath
    - linkify

sphinx:
  extra_extensions:
    - sphinx.ext.autodoc
    - sphinx.ext.napoleon
    - sphinxcontrib.mermaid
  config:
    autodoc_typehints: description
    napoleon_google_docstring: true
    napoleon_numpy_docstring: true
    html_baseurl: "https://miraflor.github.io/CGE-core/"
    html_static_path:
      - _static
    html_extra_path:
      - microsites
    html_css_files:
      - custom.css
    html_meta:
      description: "CGE-Core: a Python/Pyomo framework for computable general equilibrium modelling and reproducible policy simulation."
    mathjax3_config:
      tex:
        macros: {}

    # Mermaid 2.x follows the documentation theme and re-renders when the
    # reader switches between light and dark mode.
    mermaid_light_theme: neutral
    mermaid_dark_theme: dark
    mermaid_version: "11.12.1"

    # Make every Mermaid diagram inspectable rather than a static thumbnail.
    # D3 zoom supports wheel/pinch zoom and drag-to-pan; fullscreen adds an
    # explicit control in the upper-right corner of each diagram.
    mermaid_d3_zoom: true
    mermaid_fullscreen: true
    mermaid_fullscreen_button: "⛶"
    mermaid_fullscreen_button_opacity: 65
